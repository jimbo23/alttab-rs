<?xml version="1.0" encoding="UTF-8"?>
<!-- alttab-rs AppIcon. GPL-3.0-only. 1024x1024 macOS grid: 824px squircle body centred, 100px margin. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B2CC9"/>
      <stop offset="0.55" stop-color="#6A2BD8"/>
      <stop offset="1" stop-color="#E0457B"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9E6FA"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A3D"/>
      <stop offset="1" stop-color="#E8590C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1A0B4D" flood-opacity="0.35"/>
    </filter>
    <filter id="outer" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185" ry="185"/></clipPath>
  </defs>

  <!-- body -->
  <g filter="url(#outer)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="420" fill="url(#gloss)"/>
  </g>

  <!-- back window cards (the "other windows" in the switcher) -->
  <g filter="url(#shadow)">
    <rect x="232" y="262" width="420" height="300" rx="34" fill="#FFFFFF" fill-opacity="0.30"/>
    <rect x="302" y="322" width="420" height="300" rx="34" fill="#FFFFFF" fill-opacity="0.55"/>
  </g>

  <!-- front, selected window card -->
  <g filter="url(#shadow)">
    <rect x="372" y="382" width="420" height="300" rx="34" fill="url(#card)"/>
    <!-- title bar -->
    <path d="M406 382 h352 a34 34 0 0 1 34 34 v30 h-420 v-30 a34 34 0 0 1 34 -34 z" fill="#D9D4F5"/>
    <circle cx="414" cy="414" r="11" fill="#FF5F57"/>
    <circle cx="448" cy="414" r="11" fill="#FEBC2E"/>
    <circle cx="482" cy="414" r="11" fill="#28C840"/>
    <!-- content lines -->
    <rect x="410" y="482" width="230" height="22" rx="11" fill="#B9B1EC"/>
    <rect x="410" y="526" width="320" height="22" rx="11" fill="#CFC9F3"/>
    <rect x="410" y="570" width="270" height="22" rx="11" fill="#CFC9F3"/>
  </g>
  <!-- selection ring -->
  <rect x="356" y="366" width="452" height="332" rx="46" fill="none" stroke="#FFFFFF" stroke-width="12"/>

  <!-- tab key glyph (rust-orange badge) -->
  <g filter="url(#shadow)">
    <rect x="230" y="636" width="250" height="168" rx="40" fill="url(#rust)"/>
    <!-- ⇥ arrow to bar -->
    <path d="M276 720 H388" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
    <path d="M352 682 L394 720 L352 758" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M436 680 V760" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
  </g>
</svg>
