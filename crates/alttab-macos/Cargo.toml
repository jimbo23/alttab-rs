[package]
name = "alttab-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "alttab-rs"
path = "src/main.rs"

[dependencies]
alttab-core = { path = "../alttab-core" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication", "NSPanel", "NSWindow", "NSView", "NSControl", "NSButton"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSGeometry", "NSArray", "NSNotification", "objc2-core-foundation"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGImage", "CGColor"] }
objc2-screen-capture-kit = { version = "=0.3.2", default-features = false, features = ["std", "SCShareableContent", "SCScreenshotManager", "SCStream", "block2", "objc2-core-foundation", "objc2-core-graphics"] }
block2 = "=0.6.2"
dispatch2 = "=0.3.1"
