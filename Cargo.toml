[workspace]
members = ["crates/alttab-core", "crates/alttab-macos"]
default-members = ["crates/alttab-core"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/jimbo23/alttab-rs"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.8"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
