name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo fmt --all --check
      - name: Lint both native architectures
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --locked --target aarch64-apple-darwin -- -D warnings
          cargo clippy --workspace --all-targets --locked --target x86_64-apple-darwin -- -D warnings
      - run: cargo test --locked -p alttab-core
      - name: Build universal app and archive
        id: bundle
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: scripts/bundle.sh
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bundle.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.bundle.outputs.archive }}
          fail_on_unmatched_files: true
          generate_release_notes: true
      - name: Checkout optional Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: jimbo23/homebrew-alttab-rs
          token: ${{ env.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Update optional Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          VERSION: ${{ steps.bundle.outputs.version }}
          SHA256: ${{ steps.bundle.outputs.sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import re
          version = os.environ['VERSION']
          checksum = os.environ['SHA256']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:[+-][0-9A-Za-z.-]+)?', version):
              raise SystemExit('Invalid Cargo version')
          if not re.fullmatch(r'[0-9a-f]{64}', checksum):
              raise SystemExit('Invalid archive checksum')
          source = pathlib.Path('packaging/homebrew/Casks/alttab-rs.rb').read_text()
          source, versions = re.subn(r'^  version "[^"]+"$', f'  version "{version}"', source, flags=re.MULTILINE)
          source, checksums = re.subn(r'^  sha256 "[^"]+"$', f'  sha256 "{checksum}"', source, flags=re.MULTILINE)
          if (versions, checksums) != (1, 1):
              raise SystemExit('Unexpected cask template layout')
          destination = pathlib.Path('homebrew-tap/Casks/alttab-rs.rb')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(source)
          PY
          git -C homebrew-tap config user.name 'github-actions[bot]'
          git -C homebrew-tap config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C homebrew-tap add -- Casks/alttab-rs.rb
          if ! git -C homebrew-tap diff --cached --quiet; then
            git -C homebrew-tap commit -m "Update AltTab-rs to $VERSION"
            git -C homebrew-tap push
          fi
